<svg width="64" height="64" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="fav-border-grad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="50%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#c084fc" />
        </linearGradient>
        <linearGradient id="fav-star-grad" x1="18" y1="13" x2="28" y2="23" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="40%" stop-color="#facc15" />
            <stop offset="100%" stop-color="#f59e0b" />
        </linearGradient>
        <linearGradient id="fav-bg-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>
    </defs>
    <!-- Khung nền lịch bo góc -->
    <rect x="3" y="5" width="26" height="24" rx="7" fill="url(#fav-bg-grad)" stroke="url(#fav-border-grad)" stroke-width="2"/>
    <!-- 2 móc treo lịch -->
    <rect x="8.5" y="2" width="3" height="5" rx="1.5" fill="#38bdf8"/>
    <rect x="20.5" y="2" width="3" height="5" rx="1.5" fill="#c084fc"/>
    <!-- Đường phân chia đầu lịch -->
    <line x1="3" y1="12" x2="29" y2="12" stroke="url(#fav-border-grad)" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Dải timeline sự kiện đa tầng -->
    <rect x="7" y="16" width="9" height="3" rx="1.5" fill="#38bdf8" fill-opacity="0.9"/>
    <rect x="7" y="21" width="13" height="3" rx="1.5" fill="#818cf8" fill-opacity="0.9"/>
    <!-- Ngôi sao 4 cánh phát sáng -->
    <path d="M22 12 C22 16.5, 26.5 16.5, 26.5 16.5 C26.5 16.5, 22 16.5, 22 21 C22 16.5, 17.5 16.5, 17.5 16.5 C17.5 16.5, 22 16.5, 22 12 Z" fill="url(#fav-star-grad)"/>
    <circle cx="22" cy="16.5" r="1.3" fill="#ffffff"/>
</svg>
